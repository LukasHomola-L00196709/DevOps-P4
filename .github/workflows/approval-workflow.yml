name: Pull Request Labeler

on:
  pull_request_review:
    types: [submitted]

jobs:
  label-when-approved:
    name: Label PR when approved
    runs-on: ubuntu-latest
    steps:
    - name: Label when approved
      uses: pullreminders/label-when-approved-action@v1.0.5
      env:
        APPROVALS_REQUIRED: 1
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        ADD_LABEL: "approved"
        # REMOVE_LABEL: "awaiting review"
